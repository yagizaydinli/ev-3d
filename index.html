function applyMode(){
  if(!ok||!house) return;
  house.visible=mode==='3d'; photoG.visible=mode==='photo'; ctrl.enabled=mode==='3d';
  const night=P.night&&mode==='3d';
  const mt=struct&&struct.getObjectByName('mat'); if(mt) mt.visible=mode==='3d';
  hemi.intensity=night?.1:.3; sun.intensity=night?0:(mode==='3d'?2.6:1.7);
  if(mode==='3d') sun.position.set(-11,17,15); else sun.position.set(13,14,3.6);
  scene.environment=night?null:envMap; if(dome) dome.visible=!night; M.led.emissiveIntensity=night?2.4:.12;
  lamps.forEach(l=>l.intensity=night?1.5:0);
  renderer.setClearColor(night?0x10151b:0x000000,night?1:0);
}

}
document.querySelectorAll('#views button[data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
